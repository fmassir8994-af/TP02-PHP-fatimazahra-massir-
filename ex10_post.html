<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Formulaire POST</title></head>
<body>
<h1>Formulaire avec POST</h1>
<form action="ex10_post.php" method="post">
    <label>Nom : <input type="text" name="nom" required></label><br><br>
    <label>Prénom : <input type="text" name="prenom" required></label><br><br>
    <label>Groupe :
        <select name="groupe" required>
            <option value="">Choisir un groupe</option>
            <option value="G1">G1</option><option value="G2">G2</option>
            <option value="G3">G3</option><option value="G4">G4</option>
        </select>
    </label><br><br>
    <button type="submit">Envoyer avec POST</button>
</form>
</body>
</html>
